<div class="cols">
<div>
<ul>

<div>
<ul>

</div>
</div>

<div class="cols">

<ul>

<footer>Learning to Fly Freestyle - ArduPilot DevCon 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="Learning to Fly Freestyle - ArduPilot DevCon 2026" data-theme="n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps" lang="C" data-marpit-pagination="14" style="--paginate:true;--footer:Learning to Fly Freestyle - ArduPilot DevCon 2026;--theme:n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps;" data-marpit-pagination-total="48">
<h2 id="why-not-replay-a-pilot">Why not replay a pilot?</h2>
<div class="cols">
<div>
<p><img src="assets/pilot_replay.svg" alt="" style="width:540px;" /></p>
<ul>
<li>Stick inputs fit one battery, wind, airframe</li>
</ul>
</div>
<div>
<p><img src="assets/steve.jpg" alt="" style="height:250px;" /></p>
<ul>
<li>The pilot's moves are the reference</li>
<li>Sim and aircraft checked against them</li>
<li>Shapes, rates and timing to match</li>
</ul>
</div>
</div>
<p><span class="dim">Schematic. The pilot's profile is a feed-forward inside the loop, never an open-loop replay.</span></p>
<footer>Learning to Fly Freestyle - ArduPilot DevCon 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-scope-fXasztIe="" data-marpit-fragments="2" data-paginate="true" data-footer="Learning to Fly Freestyle - ArduPilot DevCon 2026" data-theme="n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps" lang="C" data-marpit-pagination="15" style="--paginate:true;--footer:Learning to Fly Freestyle - ArduPilot DevCon 2026;--theme:n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps;" data-marpit-pagination-total="48">
<h2 id="why-not-position-control-all-the-way-round">Why not position control all the way round?</h2>
<div class="cols">
<div>
<p><img src="assets/guided_loop.svg" alt="" style="width:440px;" /></p>
</div>
<div>
<ul>
<li>All of it flies in Guided</li>
<li>Position targets: run-ins, lines, recoveries</li>
<li>The position controller knows the limits</li>
<li>It assumes thrust holds you up</li>
</ul>
<ul>
<li data-marpit-fragment="1">...or can it?</li>
</ul>
</div>
</div>
<div class="reveal">
<ul>
<li data-marpit-fragment="2"><strong>It can. The PR goes up now, live.</strong><span>Thrust past 90 deg, vertical arc waypoints. <code>PSC_TVEC_EN</code>, off by default.</span></li>
</ul>
</div>
<footer>Learning to Fly Freestyle - ArduPilot DevCon 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-footer="Learning to Fly Freestyle - ArduPilot DevCon 2026" data-theme="n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps" lang="C" data-marpit-pagination="16" style="--paginate:true;--footer:Learning to Fly Freestyle - ArduPilot DevCon 2026;--theme:n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps;" data-marpit-pagination-total="48">
<h2 id="rate-and-thrust-with-angle-boost-off">Rate and thrust, with angle boost off</h2>
<p><img src="assets/boost_loops.svg" alt="" style="width:720px;" /></p>
<div class="cols">
<div>
<ul>
<li>The script sends body rate and thrust</li>
<li>Every thrust a g-load, measured in flight</li>
</ul>
</div>
<div>
<ul>
<li>Boost on, the first loop climbed 32 m</li>
<li>Angle boost off: the g asked is given</li>
</ul>
</div>
</div>
<p><span class="dim">Half speed; the left is simulated. Dashed arrow: asked. Solid: given.</span></p>
<footer>Learning to Fly Freestyle - ArduPilot DevCon 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="Learning to Fly Freestyle - ArduPilot DevCon 2026" data-theme="n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps" lang="C" data-marpit-pagination="17" style="--paginate:true;--footer:Learning to Fly Freestyle - ArduPilot DevCon 2026;--theme:n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps;" data-marpit-pagination-total="48">
<h2 id="the-split">The split</h2>
<p>All of it is Guided: the script picks the command each segment trusts.</p>
<p><img src="assets/split_segments.svg" alt="" style="width:700px;" /></p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-scope-Nxq8xY7e="" data-marpit-fragments="4" data-paginate="true" data-footer="Learning to Fly Freestyle - ArduPilot DevCon 2026" data-theme="n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps" lang="C" data-marpit-pagination="18" style="--paginate:true;--footer:Learning to Fly Freestyle - ArduPilot DevCon 2026;--theme:n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps;" data-marpit-pagination-total="48">
<h2 id="testing">Testing</h2>
<div class="ladder">
<ul>
<li data-marpit-fragment="1"><span class="n">Static: Lua benches and log analysis</span><span class="c">105 scripts</span><span class="w">the maths and every flight, checked offline</span></li>
<li data-marpit-fragment="2"><span class="n">Native SITL</span><span class="c">32 tests</span><span class="w">the Rise255 model, the autotest suite</span></li>
<li data-marpit-fragment="3"><span class="n">RealFlight</span><span class="c">17 tests</span><span class="w">the same autotest, a virtual joystick</span></li>
<li data-marpit-fragment="4"><span class="n">The Marmott</span><span class="c">the only witness</span><span class="w">a field card per session</span></li>
</ul>
</div>
<p><span class="dim">Cheapest first; each rung catches what the one above cannot.</span></p>
<footer>Learning to Fly Freestyle - ArduPilot DevCon 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="Learning to Fly Freestyle - ArduPilot DevCon 2026" data-theme="n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps" lang="C" data-marpit-pagination="19" style="--paginate:true;--footer:Learning to Fly Freestyle - ArduPilot DevCon 2026;--theme:n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps;" data-marpit-pagination-total="48">
<h2 id="testing-in-realflight">Testing in RealFlight</h2>
<div class="cols">
<div>
<h3 id="what-its-for">What it's for</h3>
<ul>
<li>45 displays in an afternoon</li>
<li>Spread: +-7.4 m to +-1.5 m</li>
<li>Does the show hold together</li>
</ul>
</div>
<div>
<h3 id="watch-for-its-limits">Watch for its limits</h3>
<ul>
<li>Drag: 0.40-0.45 g vs 0.30</li>
<li>Idle: 0.83 g vs ~0.2</li>
<li>Lua at 97 Hz vs 24.5</li>
<li>The shape of an arc</li>
</ul>
</div>
</div>
<div class="warn">
<p>For a month both sims flew renamed parameters: dropped silently from a defaults file.</p>
</div>
<p><span class="dim">Each pair: RealFlight, then the Marmott.</span></p>
<footer>Learning to Fly Freestyle - ArduPilot DevCon 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="Learning to Fly Freestyle - ArduPilot DevCon 2026" data-class="section" data-theme="n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps" lang="C" class="section" data-marpit-pagination="20" style="--paginate:true;--footer:Learning to Fly Freestyle - ArduPilot DevCon 2026;--class:section;--theme:n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps;" data-marpit-pagination-total="48">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="Learning to Fly Freestyle - ArduPilot DevCon 2026" data-class="section" data-theme="n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps" lang="C" class="section" data-marpit-pagination="21" style="--paginate:true;--footer:Learning to Fly Freestyle - ArduPilot DevCon 2026;--class:section;--theme:n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps;" data-marpit-pagination-total="48">
<h1 id="what-went-wrong-and-how-do-we-fix-it">What went wrong, and how do we fix it?</h1>
<h2 id="when-physical-reality-intervenes">When physical reality intervenes</h2>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="Learning to Fly Freestyle - ArduPilot DevCon 2026" data-theme="n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps" lang="C" data-marpit-pagination="22" style="--paginate:true;--footer:Learning to Fly Freestyle - ArduPilot DevCon 2026;--theme:n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps;" data-marpit-pagination-total="48">
<h2 id="problem-1-19-july-the-drag-we-didnt-size-for">Problem 1: 19 July, the drag we didn't size for</h2>
<p><img src="assets/crash_story.svg" alt="" style="width:680px;" /></p>
<div class="warn">
<p><code>AUTA_LP_DRAG</code> is not a drag estimate. It is the safety factor.</p>
</div>
<p><span class="dim">Schematic, numbers from the log. Sized on 0.30 g of drag; it met 0.65.</span></p>
<footer>Learning to Fly Freestyle - ArduPilot DevCon 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="Learning to Fly Freestyle - ArduPilot DevCon 2026" data-theme="n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps" lang="C" data-marpit-pagination="23" style="--paginate:true;--footer:Learning to Fly Freestyle - ArduPilot DevCon 2026;--theme:n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps;" data-marpit-pagination-total="48">
<h2 id="rule-1-always-finish-the-figure">Rule 1: always finish the figure</h2>
<div class="cols">
<div>
<p><img src="assets/crash_rotation.svg" alt="" style="width:560px;" /></p>
</div>
<div>
<p><img src="assets/fig_check.svg" alt="" style="width:420px;" /></p>
<ul>
<li>Refuse only at the start, on height</li>
<li>Once started, give up the circle</li>
<li>Rotation is free: finish on it</li>
</ul>
</div>
</div>
<p><span class="dim">A check before the figure can't see inside it: the loop that flew was further short than the one that crashed.</span></p>
<footer>Learning to Fly Freestyle - ArduPilot DevCon 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-scope-GgF2KSEY="" data-paginate="true" data-footer="Learning to Fly Freestyle - ArduPilot DevCon 2026" data-theme="n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps" lang="C" data-marpit-pagination="24" style="--paginate:true;--footer:Learning to Fly Freestyle - ArduPilot DevCon 2026;--theme:n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps;" data-marpit-pagination-total="48">
<h2 id="problem-2-the-twitch-between-figures">Problem 2: the twitch between figures</h2>
<div class="tw">
<div>
<p><img src="assets/twitch_live.svg" alt="" style="width:700px;" /></p>
</div>
<div>
<ul>
<li>The next figure wants a new speed</li>
<li>Position control goes as hard as <code>WP_ACC</code> allows</li>
<li>The quad slams to its lean limit, then swings back</li>
</ul>
<div class="ok">
<p>Rule 2: turn the position controller down between figures.</p>
</div>
</div>
</div>
<p><span class="dim">Schematic. Fix: each line lowers <code>WP_ACC</code> and <code>PSC_JERK_NE</code> for its span.</span></p>
<footer>Learning to Fly Freestyle - ArduPilot DevCon 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-footer="Learning to Fly Freestyle - ArduPilot DevCon 2026" data-theme="n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps" lang="C" data-marpit-pagination="25" style="--paginate:true;--footer:Learning to Fly Freestyle - ArduPilot DevCon 2026;--theme:n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps;" data-marpit-pagination-total="48">
<h2 id="problem-3-handing-over-still-rotating">Problem 3: handing over still rotating</h2>
<p>Thrust is how a quad climbs, brakes and accelerates, and it points where the body points.</p>
<p><img src="assets/thrust_sweep.svg" alt="" style="width:600px;" /></p>
<div class="ok">
<p>Rule 3: don't correct at the wrong moment. Brake the rotation, then thrust.</p>
</div>
<p><span class="dim">Twelve instances. Immelmann: 764 dps, 142 deg past upright. Loop-spin: 182 dps, 36 deg past level.</span></p>
<footer>Learning to Fly Freestyle - ArduPilot DevCon 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-footer="Learning to Fly Freestyle - ArduPilot DevCon 2026" data-theme="n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps" lang="C" data-marpit-pagination="26" style="--paginate:true;--footer:Learning to Fly Freestyle - ArduPilot DevCon 2026;--theme:n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps;" data-marpit-pagination-total="48">
<h2 id="problem-4-the-wind">Problem 4: the wind</h2>
<div class="cols">
<div>
<p><img src="assets/wind_drift.svg" alt="" style="width:520px;" /></p>
</div>
<div>
<ul>
<li>Figures fly the air, lines the ground</li>
<li>A mirrored repeat doubles the drift</li>
<li>Placement centres the box, can't shrink it</li>
<li>The fence knows nothing of wind</li>
</ul>
</div>
</div>
<div class="params">
<p><code>EK3_DRAG_MCOEF</code> = 0.22: EKF3 estimates wind only by drag fusion; fitted off the Marmott's own logs</p>
</div>
<div class="ok">
<p>Rule 4: don't chase the wind on the lines. Paying it back grew the box 60-110 m (RealFlight).</p>
</div>
<p><span class="dim">26 Sep: 76 m from its mirror in 1-2 m/s along. 28 Sep: 34 m off the line in 3-4 m/s across.</span></p>
<footer>Learning to Fly Freestyle - ArduPilot DevCon 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-footer="Learning to Fly Freestyle - ArduPilot DevCon 2026" data-theme="n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps" lang="C" data-marpit-pagination="27" style="--paginate:true;--footer:Learning to Fly Freestyle - ArduPilot DevCon 2026;--theme:n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps;" data-marpit-pagination-total="48">
<h2 id="building-it-with-claude-code">Building it with Claude Code</h2>
<p><img src="assets/rules_pipeline_bin.svg" alt="" style="width:820px;" /></p>
<div class="cols">
<div>
<ul>
<li>Every session reads all of it first</li>
<li>Rules promoted only once proven</li>
</ul>
</div>
<div>
<ul>
<li>56 dead ideas, killed by measurement</li>
<li>Offline, SITL, RealFlight, then fly</li>
</ul>
</div>
</div>
<footer>Learning to Fly Freestyle - ArduPilot DevCon 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-scope-3bEQ0JJo="" data-marpit-fragments="5" data-paginate="true" data-footer="Learning to Fly Freestyle - ArduPilot DevCon 2026" data-theme="n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps" lang="C" data-marpit-pagination="28" style="--paginate:true;--footer:Learning to Fly Freestyle - ArduPilot DevCon 2026;--theme:n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps;" data-marpit-pagination-total="48">
<h2 id="problem-5-a-convincing-wrong-answer">Problem 5: a convincing wrong answer</h2>
<div class="claim"><span>Claude:</span> the sideways speed handed over causes the drift</div>
<div class="cols">
<div>
<ul>
<li data-marpit-fragment="1"><strong>Correlation:</strong> more sideways speed, more drift, r = +0.86 <span class="stamp">TRUE</span></li>
<li data-marpit-fragment="2"><strong>Control:</strong> two identical immelmanns, 11.6 m against 6.1 m, 4 runs of 4 <span class="stamp">TRUE</span></li>
<li data-marpit-fragment="3"><strong>Mechanism:</strong> a line of code commands them differently <span class="stamp">TRUE</span></li>
</ul>
</div>
<div class="ab">
<ul>
<li data-marpit-fragment="4"><img src="assets/ab_null_live.svg" alt="" style="width:440px;" /></li>
</ul>
</div>
</div>
<div class="wrong">
<ul>
<li data-marpit-fragment="5">WRONG</li>
</ul>
</div>
<p><span class="dim">RealFlight, 2 Sep. Every fact was true; the conclusion was not.</span></p>
<div class="ok">
<p>Rule 5: measure every time it explains. Two runs, four mechanisms dead in one day.</p>
</div>
<footer>Learning to Fly Freestyle - ArduPilot DevCon 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-scope-zOovjXFY="" data-paginate="true" data-footer="Learning to Fly Freestyle - ArduPilot DevCon 2026" data-theme="n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps" lang="C" data-marpit-pagination="29" style="--paginate:true;--footer:Learning to Fly Freestyle - ArduPilot DevCon 2026;--theme:n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps;" data-marpit-pagination-total="48">
<h2 id="the-rules">The rules</h2>

<table>
<thead>
<tr>
<th>Problem</th>
<th>Rule</th>
</tr>
</thead>
<tbody>
<tr>
<td>1. The drag we didn't size for</td>
<td>Always finish the figure</td>
</tr>
<tr>
<td>2. The twitch between figures</td>
<td>Turn position control down between figures</td>
</tr>
<tr>
<td>3. Handing over still rotating</td>
<td>Brake the rotation, then thrust</td>
</tr>
<tr>
<td>4. The wind</td>
<td>Don't chase it on the lines</td>
</tr>
<tr>
<td>5. A convincing wrong answer</td>
<td>Measure every time it explains</td>
</tr>
</tbody>
</table>
<footer>Learning to Fly Freestyle - ArduPilot DevCon 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-footer="Learning to Fly Freestyle - ArduPilot DevCon 2026" data-theme="n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps" lang="C" data-marpit-pagination="30" style="--paginate:true;--footer:Learning to Fly Freestyle - ArduPilot DevCon 2026;--theme:n8heu9ryy8rqvh3dd6i3uxzti6xqug8nrlklafjps;" data-marpit-pagination-total="48">
<h2 id="what-the-branch-needed">What the branch needed</h2>
<div class="params">
<p>set_target_rate_and_throttle(..., use_angle_boost)<br />
set_target_angle_and_rate_and_throttle(..., use_angle_boost)<br />
set_target_rate_and_climbrate(...)<br />
AC_Fence polygon build bindings</p>

<h2 id="zero-throttle-is-not-zero-thrust">Zero throttle is not zero thrust</h2>
<ul>
<li>The mixer lifts the average for authority</li>
<li>0.44-0.52 g at zero, while rotating</li>
<li>So &quot;ballistic&quot; still carries thrust</li>
<li>An upright cut arrests at ~0.5 g, not 1</li>
</ul>
<div class="params">
<p><code>MOT_SPIN_MIN</code> at the bottom of the thrust curve<br />
Above it, every &quot;zero thrust&quot; segment carries thrust</p>
</div>
<p><span class="dim">Marmott. Idle alone is 0.17-0.22 g; RealFlight's is 0.83 g.</span></p>
<footer>Learning to Fly Freestyle - ArduPilot DevCon 2026</footer>
</section>

<h2 id="where-segments-hand-over">Where segments hand over</h2>
<table>
<thead>
<tr>
<th>Handover</th>
<th>What went wrong</th>
<th>Fix</th>
</tr>
</thead>
<tbody>
<tr>
<td>Line to line</td>
<td><code>WP_ACC</code> pegged: the twitch</td>
<td>Lines deliver the next entry speed</td>
</tr>
<tr>
<td>Arc to apex</td>
<td>Half-roll handed over at 764 dps</td>
<td>Brake to an attitude, then hand over</td>
</tr>
<tr>
<td>Fall to hover</td>
<td>Recover aimed low: 3.6 m under the start</td>
<td>Aim at the height the figure meant</td>
</tr>
</tbody>
</table>
<p>Clean when speed and load are continuous across it.</p>
<footer>Learning to Fly Freestyle - ArduPilot DevCon 2026</footer>
</section>

<h2 id="what-the-pilot-did-give-us">What the pilot did give us</h2>
<div class="cols">
<div>
<ul>
<li>Reference moves: log271, and Steve on the Marmott</li>
<li>Sim and aircraft checked against the same log</li>
<li>Shapes, rates and timing to match</li>
</ul>
</div>
<div>
<p><img src="assets/steve.jpg" alt="" style="height:300px;" /></p>
</div>
</div>
<div class="ok">
<p>Caught: our knife edge, tuned in RealFlight, was a wingover. It fell 4 m where the pilot's falls 12.6, because his bank is a schedule (86, 68, 20 deg), not a hold.</p>
</div>
<p><span class="dim">The pilot's profile is a feed-forward inside the loop, never an open-loop replay.</span></p>
<footer>Learning to Fly Freestyle - ArduPilot DevCon 2026</footer>
</section>

<h2 id="test-a-move-from-the-transmitter">Test a move from the transmitter</h2>
<div class="cols">
<div>
<p><img src="assets/crsf_menu.jpg" alt="" style="width:560px;" /></p>
</div>
<div>
<ul>
<li>Pick any of 19 moves</li>
<li>Resize it between runs: 8-30 m</li>
<li>Set the height floor</li>
<li>Flip Scripting1 to fly it</li>
<li>No laptop in the field</li>
</ul>
</div>
</div>
<footer>Learning to Fly Freestyle - ArduPilot DevCon 2026</footer>

<h2 id="living-inside-the-scripting-engine">Living inside the scripting engine</h2>
<ul>
<li>500 KB of heap for every script</li>
<li>Split moves by show, not family</li>
<li>Compile on the idle path, not load</li>
<li>Lua's 100-local limit: 101 fails silently</li>
<li>24.5 Hz on the aircraft: 29 deg per tick at 700 dps</li>
</ul>
<p><span class="dim">Load order was worth more than bytes: one moved require took the peak 500k to 475-485k.</span></p>
<footer>Learning to Fly Freestyle - ArduPilot DevCon 2026</footer>
</section>

<h2 id="rules-it-earned">Rules it earned</h2>
<ul>
<li>A figure is never energy-limited; only its radius is</li>
<li>A move is handed the speed it wants</li>
<li>A handover gate is guilty until measured</li>
<li>The display is bimodal: one run proves nothing</li>
<li>Do not tune the loop against RealFlight</li>
</ul>
<footer>Learning to Fly Freestyle - ArduPilot DevCon 2026</footer>
</section>
